ext><rect x="320.424" y="203.257" width="268.291" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="330.424" y="224.396" fill="#000" font-size="12" textLength="248.291">Replace all actions with the forced action</text><rect x="346.607" y="285.789" width="215.926" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="356.607" y="306.927" fill="#000" font-size="12" textLength="195.926">... BasicStateMachine.update()...</text><ellipse cx="454.57" cy="350.757" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="454.57" cy="350.757" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="387.364,139.266,521.776,139.266,533.776,151.266,521.776,163.266,387.364,163.266,375.364,151.266,387.364,139.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="458.57" y="173.476" fill="#000" font-size="11" textLength="19.008">yes</text><text x="387.364" y="155.074" fill="#000" font-size="11" textLength="134.412">A forced action was set?</text><text x="533.776" y="148.671" fill="#000" font-size="11" textLength="13.702">no</text><rect x="300.672" y="403.757" width="307.795" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="310.672" y="424.896" fill="#000" font-size="12" textLength="287.795">Add the queued action to the requested actions</text><rect x="207.416" y="447.726" width="584.492" height="587.766" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M524.165,447.726 L524.165,457.023 L514.165,467.023 L207.416,467.023" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="210.416" y="461.721" fill="#000" font-size="14" textLength="306.749">PlayerActionManager._implProcessActions()</text><rect x="230.002" y="477.023" width="488.822" height="320.203" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M544