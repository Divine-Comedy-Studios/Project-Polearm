<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:657px;height:749px;background:#FFFFFF;" width="657px" height="749px" viewBox="0 0 657 749" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="16" y="16" width="621.62" height="713.769" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M225.808,16 L225.808,25.297 L215.808,35.297 L16,35.297" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="29.995" fill="#000" font-size="14" textLength="199.808">EntityAction.actionViability()</text><ellipse cx="322.69" cy="55.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="248.263" y="135.309" width="148.854" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="258.263" y="156.447" fill="#000" font-size="12" textLength="128.854">Return "same action"</text><ellipse cx="322.69" cy="208.391" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="322.69" cy="208.391" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="195.083,85.297,450.296,85.297,462.296,98.102,450.296,110.906,195.083,110.906,183.083,98.102,195.083,85.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="326.69" y="121.117" fill="#000" font-size="11" textLength="19.008">yes</text><text x="195.083" y="95.507" fill="#000" font-size="11" textLength="205.482">Same type as the current action AND</text><text x="195.083" y="108.312" fill="#000" font-size="11" textLength="255.213">action configuration states it is not repeatable</text><text x="462.296" y="95.507" fill="#000" font-size="11" textLength="13.702">no</text><rect x="255.183" y="337.012" width="135.014" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="265.183" y="358.15" fill="#000" font-size="12" textLength="115.014">Return "not viable"</text><ellipse cx="322.69" cy="403.691" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="322.69" cy="403.691" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="47.76,261.391,597.62,261.391,609.62,287,597.62,312.609,47.76,312.609,35.76,287,47.76,261.391" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="326.69" y="322.82" fill="#000" font-size="11" textLength="19.008">yes</text><text x="47.76" y="271.601" fill="#000" font-size="11" textLength="343.804">The action is deemed non-viable by default implementation if:</text><text x="51.256" y="284.406" fill="#000" font-size="11" textLength="257.689">- Cost on character resources can not be paid?</text><text x="51.256" y="297.21" fill="#000" font-size="11" textLength="414.267">- Action has priority 0 (utilized by idle) whilst current action is not finished?</text><text x="51.256" y="310.015" fill="#000" font-size="11" textLength="546.364">- Action has a lower priority whilst current action can not be lowered at this progress (frame data)?</text><text x="609.62" y="284.406" fill="#000" font-size="11" textLength="13.702">no</text><path d="M28,502.402 L28,557.8 A0,0 0 0 0 28,557.8 L235.183,557.8 A0,0 0 0 0 235.183,557.8 L235.183,534.101 L255.183,530.101 L235.183,526.101 L235.183,512.402 L225.183,502.402 L28,502.402 A0,0 0 0 0 28,502.402" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M225.183,502.402 L225.183,512.402 L235.183,512.402 L225.183,502.402" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="34" y="519.469" fill="#000" font-size="13" textLength="186.183">This is e.g. utilized by player</text><text x="34" y="534.602" fill="#000" font-size="13" textLength="183.898">jumping to check how many</text><text x="34" y="549.734" fill="#000" font-size="13" textLength="183.587">air jumps the player has left</text><rect x="255.183" y="513.117" width="135.014" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="265.183" y="534.255" fill="#000" font-size="12" textLength="115.014">Return "not viable"</text><ellipse cx="322.69" cy="588.8" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="322.69" cy="588.8" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="157.271,456.691,488.109,456.691,500.109,468.691,488.109,480.691,157.271,480.691,145.271,468.691,157.271,456.691" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="326.69" y="490.902" fill="#000" font-size="11" textLength="19.008">yes</text><text x="157.271" y="472.5" fill="#000" font-size="11" textLength="330.838">Custom implementation of funcion _viable() rejects function</text><text x="500.109" y="466.097" fill="#000" font-size="11" textLength="13.702">no</text><rect x="266.917" y="641.8" width="111.547" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="276.917" y="662.939" fill="#000" font-size="12" textLength="91.547">Return "viable"</text><ellipse cx="322.69" cy="706.769" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="322.69" cy="706.769" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="322.69" y1="169.277" x2="322.69" y2="197.391" style="stroke:#181818;stroke-width:1;"/><polygon points="318.69,187.391,322.69,197.391,326.69,187.391,322.69,191.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="322.69" y1="110.906" x2="322.69" y2="135.309" style="stroke:#181818;stroke-width:1;"/><polygon points="318.69,125.309,322.69,135.309,326.69,125.309,322.69,129.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:m