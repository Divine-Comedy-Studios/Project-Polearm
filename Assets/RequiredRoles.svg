<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:784px;height:709px;background:#FFFFFF;" width="784px" height="709px" viewBox="0 0 784 709" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="16" y="16" width="748.986" height="673.406" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M226.313,16 L226.313,25.297 L216.313,35.297 L16,35.297" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="29.995" fill="#000" font-size="14" textLength="200.313">EnemyManager._planRoles()</text><rect x="381.251" y="45.297" width="31.443" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="391.251" y="66.436" fill="#000" font-size="12" textLength="11.443">...</text><rect x="326.8" y="99.266" width="140.346" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="336.8" y="120.404" fill="#000" font-size="12" textLength="120.346">Shuffle the enemies</text><rect x="26" y="143.234" width="728.986" height="480.203" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M285.929,143.234 L285.929,152.531 L275.929,162.531 L26,162.531" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="29" y="157.229" fill="#000" font-size="14" textLength="249.929">EnemyManager._fillRequiredRoles()</text><rect x="291.327" y="223.531" width="211.291" height="75.875" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="301.327" y="244.67" fill="#000" font-size="12" textLength="191.291">Sort enemies into three groups:</text><text x="305.142" y="258.639" fill="#000" font-size="12" textLength="166.289">- Want to leave current role</text><text x="305.142" y="272.607" fill="#000" font-size="12" textLength="155.191">- Could both stay or leave</text><text x="305.142" y="286.576" fill="#000" font-size="12" textLength="143.877">- Want to enter this role</text><rect x="260.103" y="319.406" width="273.74" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="270.103" y="340.545" fill="#000" font-size="12" textLength="253.74">Swap roles between enemies who want to</text><text x="270.103" y="354.514" fill="#000" font-size="12" textLength="227.344">enter and enemies who want to leave</text><path d="M54,383.031 L54,453.563 A0,0 0 0 0 54,453.563 L271.485,453.563 A0,0 0 0 0 271.485,453.563 L271.485,422.297 L291.485,418.297 L271.485,414.297 L271.485,393.031 L261.485,383.031 L54,383.031 A0,0 0 0 0 54,383.031" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M261.485,383.031 L261.485,393.031 L271.485,393.031 L261.485,383.031" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="60" y="400.098" fill="#000" font-size="13" textLength="182.743">This tries to satisfy enemies</text><text x="60" y="415.231" fill="#000" font-size="13" textLength="196.485">who want to leave the current</text><text x="60" y="430.364" fill="#000" font-size="13" textLength="174.751">role at the cost of enemies</text><text x="60" y="445.497" fill="#000" font-size="13" textLength="157.46">who do not have to stay</text><rect x="291.485" y="387.344" width="210.975" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="301.485" y="408.482" fill="#000" font-size="12" textLength="176.01">Swap roles between enemies</text><text x="301.485" y="422.451" fill="#000" font-size="12" textLength="190.975">who want to enter and enemies</text><text x="301.485" y="436.42" fill="#000" font-size="12" textLength="142.758">who could leave or stay</text><path d="M521.587,476.816 L521.587,500.516 L501.587,504.516 L521.587,508.516 L521.587,532.215 A0,0 0 0 0 521.587,532.215 L726.986,532.215 A0,0 0 0 0 726.986,532.215 L726.986,486.816 L716.986,476.816 L521.587,476.816 A0,0 0 0 0 521.587,476.816" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M716.986,476.816 L716.986,486.816 L726.986,486.816 L716.986,476.816" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="527.587" y="493.883" fill="#000" font-size="13" textLength="181.93">This tries, as a counterpoint</text><text x="527.587" y="509.016" fill="#000" font-size="13" textLength="184.399">to above, to satisfy enemies</text><text x="527.587" y="524.149" fill="#000" font-size="13" textLength="119.476">who want to leave</text><rect x="292.358" y="473.563" width="209.229" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="302.358" y="494.701" fill="#000" font-size="12" textLength="189.229">Demote enemies who still want</text><text x="302.358" y="508.67" fill="#000" font-size="12" textLength="172.049">to leave to the next weakest</text><text x="302.358" y="522.639" fill="#000" font-size="12" textLength="143.373">role that fits the budget</text><rect x="213.274" y="555.469" width="367.396" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="223.274" y="576.607" fill="#000" font-size="12" textLength="347.396">Fill remaining required slots with any enemy who can join</text><polygon points="306.44,179.531,487.505,179.531,499.505,191.531,487.505,203.531,306.44,203.531,294.44,191.531,306.44,179.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="306.44" y="195.339" fill="#000" font-size="11" textLength="181.065">for role in roles by strongest first</text><rect x="322.449" y="643.438" width="149.047" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="332.449" y="664.576" fill="#000" font-size="12" textLength="129.047">_promoteEnemies()...</text><line x1="396.973" y1="79.266" x2="396.973" y2="99.266" style="stroke:#181818;stroke-width:1;